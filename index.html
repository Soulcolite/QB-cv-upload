<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อัปโหลด CV ของคุณ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #06C755;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div id="loading-view" class="text-center">
        <div class="spinner mx-auto"></div>
        <p class="mt-4 text-gray-600">กำลังเตรียมพร้อม...</p>
    </div>

    <div id="main-content" class="hidden w-full max-w-md mx-auto p-4">
        <div class="bg-white rounded-lg shadow-md p-8">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">อัปโหลด CV ของคุณ</h1>
            <p class="text-center text-gray-500 mb-6">กรุณาเลือกไฟล์ PDF หรือ DOCX</p>
            
            <div id="upload-form">
                <div class="mb-4">
                    <label for="file-upload" class="w-full flex items-center justify-center px-4 py-3 bg-gray-50 text-green-700 rounded-lg border-2 border-dashed border-gray-300 cursor-pointer hover:bg-green-50 hover:border-green-400 transition-colors">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <span id="file-name-display">เลือกไฟล์</span>
                    </label>
                    <input id="file-upload" type="file" class="hidden" accept=".pdf,.doc,.docx">
                </div>

                <button id="upload-button" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-transform transform active:scale-95 disabled:bg-gray-400 disabled:cursor-not-allowed">
                    อัปโหลด
                </button>
            </div>
            
            <p id="message-text" class="mt-4 text-center"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // --- CONFIGURATION ---
            // 1. LIFF ID has been updated with your actual ID.
            const LIFF_ID = "2008189228-rqoJl24o";
            
            // 2. This URL is from your successful Cloud Function deployment.
            const SCRIPT_URL = "https://us-central1-qb-jobs-automation.cloudfunctions.net/uploadCv";

            const loadingView = document.getElementById('loading-view');
            const mainContent = document.getElementById('main-content');
            const uploadForm = document.getElementById('upload-form');
            const fileInput = document.getElementById('file-upload');
            const uploadButton = document.getElementById('upload-button');
            const messageText = document.getElementById('message-text');
            const fileNameDisplay = document.getElementById('file-name-display');
            let userId = null;

            async function initializeLiff() {
                try {
                    await liff.init({ liffId: LIFF_ID });
                    if (!liff.isLoggedIn()) {
                        liff.login();
                        return;
                    }
                    const profile = await liff.getProfile();
                    userId = profile.userId;
                    loadingView.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                } catch (error) {
                    console.error("LIFF Initialization failed:", error);
                    loadingView.innerHTML = '<p class="text-red-500">เกิดข้อผิดพลาดในการโหลดแอป</p>';
                }
            }
            
            initializeLiff();

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    fileNameDisplay.textContent = fileInput.files[0].name;
                } else {
                    fileNameDisplay.textContent = 'เลือกไฟล์';
                }
            });

            uploadButton.addEventListener('click', async () => {
                if (!fileInput.files || fileInput.files.length === 0) {
                    showMessage('กรุณาเลือกไฟล์ก่อนอัปโหลด', 'red');
                    return;
                }
                if (!userId) {
                    showMessage('ไม่สามารถระบุผู้ใช้ได้ กรุณาลองอีกครั้ง', 'red');
                    return;
                }

                const file = fileInput.files[0];
                setLoading(true, "กำลังอัปโหลด...");

                try {
                    // Using FormData to send the file and userId
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('userId', userId);
                    
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: formData, // Send as FormData
                    });

                    const result = await response.json();

                    if (response.ok && result.status === 'success') {
                        showMessage('อัปโหลด CV สำเร็จ!', 'green');
                        // Optionally close the LIFF window after success
                        setTimeout(() => liff.closeWindow(), 2000);
                    } else {
                        throw new Error(result.message || 'เกิดข้อผิดพลาดที่ไม่รู้จัก');
                    }

                } catch (error) {
                    console.error('Upload failed:', error);
                    showMessage(`อัปโหลดไม่สำเร็จ: ${error.message}`, 'red');
                } finally {
                    setLoading(false);
                }
            });

            function setLoading(isLoading, text = "") {
                uploadButton.disabled = isLoading;
                if (isLoading) {
                    uploadButton.innerHTML = `<div class="spinner spinner-sm mx-auto"></div>`;
                    messageText.textContent = text;
                    messageText.className = 'mt-4 text-center text-gray-600';
                } else {
                    uploadButton.innerHTML = 'อัปโหลด';
                    fileInput.value = ''; // Reset file input
                    fileNameDisplay.textContent = 'เลือกไฟล์';
                }
            }

            function showMessage(msg, color) {
                messageText.textContent = msg;
                messageText.className = `mt-4 text-center text-${color}-600`;
            }
        });
    </script>
</body>
</html>
